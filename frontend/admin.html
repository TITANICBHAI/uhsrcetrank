<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Dataset Workflow — UHSR CET Rank Calculator</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/portal.css"></head>
<body><div class="site-shell">
  <header class="site-header"><div class="brand-mark" aria-hidden="true">CET</div><div class="brand-copy"><h1>UHSR CET Rank Calculator 2026</h1><p>Independent Candidate Utility — Administration</p></div></header>
  <main class="page-content"><div class="admin-alert">ADMIN PANEL — NOT PUBLIC. Authentication is required for every action.</div><div id="admin-message" class="inline-message" hidden aria-live="polite"></div>
    <section class="portal-section"><h2 class="section-heading">Import Dataset</h2><div class="section-body"><form id="admin-form" class="admin-form"><div><label for="admin-secret">Admin secret</label><input id="admin-secret" name="admin_secret" type="password" autocomplete="current-password" required></div><div><label for="admin-exam">CET examination</label><select id="admin-exam" name="cet_exam" required><option value="">Select an examination</option><option value="bsc-nursing">B.Sc Nursing</option><option value="bpt">BPT</option><option value="paramedical">Paramedical</option><option value="pb-bsc-nursing">Post Basic B.Sc Nursing</option><option value="msc-nursing">M.Sc Nursing</option><option value="mpt">MPT</option><option value="npcc">NPCC</option></select></div><div><label for="markdown-file">Markdown source file</label><input id="markdown-file" name="markdown_file" type="file" accept=".md,.markdown,text/markdown" required></div><div><label for="admin-notes">Operator notes (optional)</label><input id="admin-notes" name="notes" type="text"></div><button type="submit">Import as unpublished</button></form></div></section>
    <section class="portal-section"><h2 class="section-heading">Datasets</h2><div class="section-body table-wrap"><table><thead><tr><th>ID</th><th>CET</th><th>Version</th><th>Candidates</th><th>Status</th><th>Actions</th></tr></thead><tbody id="datasets-body"></tbody></table></div></section>
    <section class="portal-section"><h2 class="section-heading">Validation Report</h2><div class="section-body"><pre id="validation-output" class="muted">Select “View validation” for an imported dataset.</pre></div></section>
  </main>
</div><script src="js/config.js"></script><script src="js/admin.js"></script></body></html>
