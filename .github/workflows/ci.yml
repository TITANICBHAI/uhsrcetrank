name: Validate UHSR CET Rank Calculator

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Check public frontend invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          public = ["index.html", "result.html", "faq.html", "methodology.html"]
          official = "https://www.uhsrcetadmissions.in/"
          notice_marker = "Important Notice"

          for name in public:
              text = (Path("frontend") / name).read_text(encoding="utf-8")
              assert official in text, f"{name} is missing the official portal link"
              assert notice_marker in text, f"{name} is missing the independent-utility notice"
          assert not any(p.name.lower().endswith(("logo.png", "emblem.png", "seal.png")) for p in Path(".").rglob("*"))
          print("Frontend integrity checks passed.")
          PY